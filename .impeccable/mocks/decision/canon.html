*{box-sizing:border-box;margin:0;padding:0}

.vp{border-radius:16px;background:radial-gradient(90% 80% at 50% 40%,#3a3c40,#151618);position:relative}
.blob{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:420px;height:90px;border-radius:40px;background:#55585e}

.cmd{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:520px;height:46px;border-radius:14px;background:#26282c;color:#9aa0a6;display:flex;align-items:center;padding:0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cell{height:120px;border-radius:12px;background:radial-gradient(#3a3c40,#1a1b1e)}.cell.on{outline:2px solid #3b82f6}
.big{margin-top:14px;padding:13px;border-radius:12px;background:#3b82f6;color:#fff;text-align:center;font-weight:700}
</style></head><body>
